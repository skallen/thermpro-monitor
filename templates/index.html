<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThermPro Monitor</title>
  <style>
    :root {
      --bg-start: #dce8f3;
      --bg-end: #c5d9e6;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #5f6c78;
      --temp: #dc5f00;
      --humid: #007e89;
      --accent: #1f6aa2;
      --grid: #d5dee8;
      --border: #bfd0de;
      --drawer: #f8fbfe;
      --shadow: rgba(16, 31, 45, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(150deg, var(--bg-start), var(--bg-end));
    }

    .shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 0.6rem;
      overflow: hidden;
    }

    .hidden-view {
      display: none !important;
    }

    .overview-panel {
      position: relative;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, #fefefe, #f3f9ff);
      box-shadow: 0 18px 30px rgba(22, 46, 66, 0.16);
      overflow: hidden;
      animation: rise-in 320ms ease-out both;
      padding: 0.9rem;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0.72rem;
    }

    .overview-header {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 0.2rem;
      text-align: center;
      padding: 0 0.15rem;
    }

    .overview-title {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      color: #1a384e;
      letter-spacing: 0;
    }

    .overview-meta {
      font-size: 0.86rem;
      color: #486579;
      font-weight: 600;
      white-space: nowrap;
    }

    .overview-grid {
      overflow-y: auto;
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 220px));
      justify-content: center;
      gap: 0.7rem;
      padding: 0.1rem;
      align-content: start;
    }

    .overview-card {
      width: 100%;
      aspect-ratio: 1 / 0.92;
      border-radius: 12px;
      border: 2px solid #94a8ba;
      background: #ffffff;
      color: var(--ink);
      padding: 0.62rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.46rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease-out, box-shadow 140ms ease-out, transform 120ms ease-out;
      box-shadow: 0 8px 18px rgba(24, 44, 61, 0.1);
    }

    .overview-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(24, 44, 61, 0.15);
    }

    .overview-card:focus-visible {
      outline: 2px solid #1c6ca7;
      outline-offset: 2px;
    }

    .overview-card--normal {
      border-color: #9fb4c5;
    }

    .overview-card--near {
      border-color: #c78a11;
      box-shadow: 0 10px 20px rgba(159, 106, 7, 0.2);
    }

    .overview-card--alert {
      border-color: #a62534;
      box-shadow: 0 10px 20px rgba(119, 26, 40, 0.24);
    }

    .overview-card--disabled {
      background: #e7edf2;
      border-color: #97a7b4 !important;
      color: #6c7a84;
      box-shadow: 0 5px 10px rgba(40, 54, 67, 0.12);
    }

    .overview-card--disabled .overview-name,
    .overview-card--disabled .overview-reading-label,
    .overview-card--disabled .overview-reading-value {
      color: #6c7a84;
    }

    .overview-name {
      font-size: 0.94rem;
      font-weight: 700;
      color: #1f3c52;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-reading-box {
      border-radius: 10px;
      border: 1px solid #c7d8e6;
      background: #f8fcff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .overview-reading {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 0.16rem;
      padding: 0.4rem 0.24rem;
      min-height: 0;
    }

    .overview-reading-label {
      font-size: 0.74rem;
      color: #4c677a;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .overview-reading-value {
      font-size: 1.04rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .overview-reading-hum {
      border-right: 1px solid #c7d8e6;
      background: #f2fbf4;
    }

    .overview-reading-hum .overview-reading-value {
      color: #12803d;
    }

    .overview-reading-temp {
      background: #fff3f3;
    }

    .overview-reading-temp .overview-reading-value {
      color: #bb2f2f;
    }

    .overview-battery {
      font-size: 0.83rem;
      font-weight: 600;
      color: #3d5d73;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .overview-battery--warning {
      color: #8a4600 !important;
      font-weight: 700;
    }

    .overview-battery--critical {
      color: #a4202b !important;
      font-weight: 800;
    }

    .overview-empty {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: #486479;
      padding: 0.72rem 0.8rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .chart-panel {
      position: relative;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, #fefefe, #f3f9ff);
      box-shadow: 0 18px 30px rgba(22, 46, 66, 0.16);
      overflow: hidden;
      animation: rise-in 320ms ease-out both;
    }

    @keyframes rise-in {
      from {
        transform: translateY(12px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    #chart {
      width: 100%;
      height: 100%;
      display: block;
    }

    #chartTitle {
      position: absolute;
      top: 0.62rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      text-align: center;
      font-size: clamp(1.15rem, 2.2vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1b364a;
      white-space: nowrap;
      max-width: 62vw;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #batteryBadge {
      position: absolute;
      top: 0.82rem;
      right: 0.82rem;
      z-index: 4;
      font-size: 0.86rem;
      color: #11324b;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      font-weight: 600;
      backdrop-filter: blur(1px);
      pointer-events: none;
    }

    .alert-banner {
      position: absolute;
      top: 3rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      max-width: min(94vw, 980px);
      padding: 0.34rem 0.72rem;
      border-radius: 10px;
      border: 1px solid #d49ba1;
      background: rgba(145, 24, 34, 0.92);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 16px rgba(88, 12, 22, 0.28);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alert-banner.hidden {
      display: none;
    }

    .legend {
      position: absolute;
      left: 0.78rem;
      bottom: 0.56rem;
      z-index: 3;
      display: flex;
      gap: 0.9rem;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.2rem 0.45rem;
      pointer-events: none;
    }

    #currentTimeDisplay {
      position: absolute;
      top: 1.06rem;
      left: 7.2rem;
      z-index: 6;
      font-size: 0.92rem;
      font-weight: 600;
      color: #23485f;
      letter-spacing: 0.01em;
      pointer-events: none;
      white-space: nowrap;
    }

    .last-update-box {
      position: absolute;
      right: 0.78rem;
      bottom: 0.56rem;
      z-index: 3;
      display: flex;
      gap: 0.35rem;
      align-items: baseline;
      white-space: nowrap;
      font-size: 0.84rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.24rem 0.52rem;
      pointer-events: none;
    }

    .time-label {
      font-weight: 600;
      color: #456176;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 0.32rem;
      vertical-align: -2px;
    }

    .swatch.temp {
      background: var(--temp);
    }

    .swatch.hum {
      background: var(--humid);
    }

    .menu-button {
      position: absolute;
      top: 0.72rem;
      left: 4.25rem;
      width: 42px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      z-index: 6;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 0 9px;
      cursor: pointer;
    }

    .back-button {
      position: absolute;
      top: 0.72rem;
      left: 0.8rem;
      min-width: 56px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: #1f3d52;
      z-index: 6;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0 0.75rem;
      cursor: pointer;
    }

    .back-button:hover {
      background: #ffffff;
    }

    .menu-button:hover {
      background: #ffffff;
    }

    .menu-button .bar {
      width: 100%;
      height: 2px;
      background: #244256;
      border-radius: 999px;
      display: block;
    }

    .control-drawer {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      bottom: 0.6rem;
      width: min(380px, calc(100vw - 1.2rem));
      z-index: 12;
      background: var(--drawer);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 14px 28px var(--shadow);
      transform: translateX(-110%);
      transition: transform 190ms ease-out;
      overflow-y: auto;
      padding: 0.9rem 0.9rem 1rem;
    }

    .control-drawer.open {
      transform: translateX(0);
    }

    .drawer-backdrop {
      position: absolute;
      inset: 0;
      z-index: 11;
      background: rgba(16, 31, 45, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease-out;
    }

    .drawer-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      color: #1e3a4f;
    }

    .close-button {
      border: 1px solid var(--border);
      background: #fff;
      color: #1e3a4f;
      border-radius: 9px;
      padding: 0.35rem 0.7rem;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .controls {
      display: grid;
      gap: 0.9rem;
    }

    .control {
      display: grid;
      gap: 0.35rem;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    select,
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.62rem;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    .time-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      align-items: center;
    }

    .range-wrap {
      display: grid;
      gap: 0.35rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .toggles {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      gap: 0.36rem;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.24rem 0.64rem;
      background: #fff;
      font-size: 0.88rem;
    }

    .status {
      margin-top: 0.95rem;
      color: #233849;
      font-size: 0.9rem;
      line-height: 1.35;
      min-height: 4.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.58rem 0.64rem;
      background: #ffffff;
      white-space: pre-line;
    }

    .unit-switch {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .unit-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.24rem 0.64rem;
      background: #fff;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .alias-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .alias-button {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.35rem 0.72rem;
      background: #fff;
      color: #1e3a4f;
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .threshold-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.48rem;
    }

    .threshold-actions {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 0.1rem;
    }

    .alert-list {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.48rem 0.56rem;
      background: #fff;
      min-height: 3.6rem;
      max-height: 9.4rem;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.32;
      color: #233849;
    }

    .alert-list-line {
      margin-bottom: 0.3rem;
    }

    .alert-list-line:last-child {
      margin-bottom: 0;
    }

    .alert-list-line.critical {
      color: #7e121d;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      .shell {
        padding: 0.45rem;
      }

      .control-drawer {
        top: 0.45rem;
        left: 0.45rem;
        bottom: 0.45rem;
        width: min(390px, calc(100vw - 0.9rem));
      }

      .legend {
        right: 0.7rem;
        left: 0.7rem;
        justify-content: center;
      }

      #currentTimeDisplay {
        top: 0.98rem;
        left: 7.95rem;
        font-size: 0.85rem;
      }

      .last-update-box {
        right: 0.7rem;
        bottom: 3.05rem;
      }

      #chartTitle {
        font-size: 1.15rem;
      }

      .alert-banner {
        top: 2.95rem;
        max-width: calc(100vw - 1.3rem);
      }

      .threshold-grid {
        grid-template-columns: 1fr;
      }

      .overview-panel {
        padding: 0.72rem;
      }

      .overview-grid {
        grid-template-columns: repeat(auto-fit, minmax(170px, 190px));
      }

      .overview-card {
        aspect-ratio: 1 / 0.98;
      }

      .menu-button {
        left: 4.15rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="overviewPanel" class="overview-panel">
      <div class="overview-header">
        <h1 class="overview-title">Filament Humidity/Temp</h1>
        <div id="overviewMeta" class="overview-meta">Updated --</div>
      </div>
      <div id="overviewGrid" class="overview-grid"></div>
    </section>

    <section id="chartPanel" class="chart-panel hidden-view">
      <button id="backButton" class="back-button" type="button" aria-label="Back to overview">Back</button>
      <button id="menuButton" class="menu-button" aria-label="Open controls" aria-expanded="false" aria-controls="controlDrawer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <div id="currentTimeDisplay">--:--:--</div>
      <div id="chartTitle">ThermPro Monitor</div>
      <div id="batteryBadge">Battery: --</div>
      <div id="alertBanner" class="alert-banner hidden" role="status" aria-live="polite"></div>
      <div class="legend">
        <span>CURRENT -</span>
        <span><span class="swatch temp"></span>Temperature: <span id="currentTempValue">--</span></span>
        <span><span class="swatch hum"></span>Humidity: <span id="currentHumidityValue">--</span></span>
      </div>
      <div class="last-update-box">
        <span class="time-label">Last update:</span><span id="lastUpdateValue">--</span>
      </div>
      <canvas id="chart"></canvas>
    </section>

    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    <aside id="controlDrawer" class="control-drawer" aria-hidden="true">
      <div class="drawer-header">
        <h2 class="drawer-title">Controls</h2>
        <button id="closeMenuButton" class="close-button">Close</button>
      </div>

      <section class="controls">
        <div class="control">
          <label for="deviceSelect">Sensor</label>
          <select id="deviceSelect"></select>
        </div>

        <div class="control">
          <label for="windowSeconds">Timescale</label>
          <div class="time-grid">
            <div class="range-wrap">
              <input id="windowSlider" type="range" min="0" max="1000" step="1" value="600">
            </div>
            <input id="windowSeconds" type="number" min="10" max="172800" step="1" value="3600">
          </div>
        </div>

        <div class="control">
          <label>Display values</label>
          <div class="toggles">
            <label class="toggle"><input id="showTemp" type="checkbox" checked> Temperature</label>
            <label class="toggle"><input id="showHumidity" type="checkbox" checked> Humidity</label>
          </div>
        </div>

        <div class="control">
          <label>Temperature unit</label>
          <div class="unit-switch" role="radiogroup" aria-label="Temperature unit">
            <label class="unit-chip"><input id="tempUnitC" type="radio" name="tempUnit" value="C" checked> Celsius</label>
            <label class="unit-chip"><input id="tempUnitF" type="radio" name="tempUnit" value="F"> Fahrenheit</label>
          </div>
        </div>

        <div class="control">
          <label>Threshold alerts (selected sensor)</label>
          <div class="threshold-grid">
            <div class="control">
              <label id="thresholdTempLowLabel" for="thresholdTempLow">Temp low (C)</label>
              <input id="thresholdTempLow" type="number" step="0.1" placeholder="off">
            </div>
            <div class="control">
              <label id="thresholdTempHighLabel" for="thresholdTempHigh">Temp high (C)</label>
              <input id="thresholdTempHigh" type="number" step="0.1" placeholder="off">
            </div>
            <div class="control">
              <label for="thresholdHumidityLow">Humidity low (%)</label>
              <input id="thresholdHumidityLow" type="number" min="0" max="100" step="1" placeholder="off">
            </div>
            <div class="control">
              <label for="thresholdHumidityHigh">Humidity high (%)</label>
              <input id="thresholdHumidityHigh" type="number" min="0" max="100" step="1" placeholder="off">
            </div>
          </div>
          <div class="threshold-actions">
            <button id="saveThresholdButton" class="alias-button" type="button">Save Thresholds</button>
            <button id="clearThresholdButton" class="alias-button" type="button">Clear</button>
          </div>
        </div>

        <div class="control">
          <label for="sensorAliasInput">Sensor Identifier</label>
          <input id="sensorAliasInput" type="text" maxlength="40" placeholder="Enter sensor identifier">
          <div class="alias-actions">
            <button id="saveAliasButton" class="alias-button" type="button">Save Identifier</button>
            <button id="clearAliasButton" class="alias-button" type="button">Clear</button>
          </div>
        </div>

        <div class="control">
          <label for="alertsList">Active alerts (all sensors)</label>
          <div id="alertsList" class="alert-list"></div>
        </div>
      </section>

      <div class="status" id="statusText"></div>
    </aside>
  </main>

  <script>
    const MIN_SECONDS = 10;
    const MAX_SECONDS = 172800;
    const REFRESH_MS = 10000;
    const TEMP_NEAR_MARGIN_C = 1.0;
    const HUMIDITY_NEAR_MARGIN_PCT = 5;
    const SENSOR_STALE_SECONDS = 90;

    const state = {
      devices: [],
      selectedAddress: null,
      windowSeconds: 3600,
      showTemp: true,
      showHumidity: true,
      temperatureUnit: "C",
      points: [],
      latest: null,
      batteryPct: null,
      drawWidth: 0,
      drawHeight: 0,
      menuOpen: false,
      sensorAliases: {},
      aliasInputAddress: null,
      aliasInputDirty: false,
      sensorThresholds: {},
      thresholdInputAddress: null,
      thresholdInputDirty: false,
      activeAlertsByAddress: {},
      viewMode: "overview",
    };

    const dom = {
      overviewPanel: document.getElementById("overviewPanel"),
      overviewGrid: document.getElementById("overviewGrid"),
      overviewMeta: document.getElementById("overviewMeta"),
      chartPanel: document.getElementById("chartPanel"),
      backButton: document.getElementById("backButton"),
      chart: document.getElementById("chart"),
      menuButton: document.getElementById("menuButton"),
      closeMenuButton: document.getElementById("closeMenuButton"),
      controlDrawer: document.getElementById("controlDrawer"),
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      deviceSelect: document.getElementById("deviceSelect"),
      windowSlider: document.getElementById("windowSlider"),
      windowSeconds: document.getElementById("windowSeconds"),
      showTemp: document.getElementById("showTemp"),
      showHumidity: document.getElementById("showHumidity"),
      tempUnitC: document.getElementById("tempUnitC"),
      tempUnitF: document.getElementById("tempUnitF"),
      thresholdTempLowLabel: document.getElementById("thresholdTempLowLabel"),
      thresholdTempHighLabel: document.getElementById("thresholdTempHighLabel"),
      thresholdTempLow: document.getElementById("thresholdTempLow"),
      thresholdTempHigh: document.getElementById("thresholdTempHigh"),
      thresholdHumidityLow: document.getElementById("thresholdHumidityLow"),
      thresholdHumidityHigh: document.getElementById("thresholdHumidityHigh"),
      saveThresholdButton: document.getElementById("saveThresholdButton"),
      clearThresholdButton: document.getElementById("clearThresholdButton"),
      sensorAliasInput: document.getElementById("sensorAliasInput"),
      saveAliasButton: document.getElementById("saveAliasButton"),
      clearAliasButton: document.getElementById("clearAliasButton"),
      alertBanner: document.getElementById("alertBanner"),
      alertsList: document.getElementById("alertsList"),
      statusText: document.getElementById("statusText"),
      batteryBadge: document.getElementById("batteryBadge"),
      chartTitle: document.getElementById("chartTitle"),
      currentTempValue: document.getElementById("currentTempValue"),
      currentHumidityValue: document.getElementById("currentHumidityValue"),
      currentTimeDisplay: document.getElementById("currentTimeDisplay"),
      lastUpdateValue: document.getElementById("lastUpdateValue"),
    };

    function normalizeAddress(address) {
      return String(address || "").trim().toLowerCase();
    }

    let dashboardSettingsSaveTimer = null;
    let dashboardSettingsSaveInFlight = false;
    let dashboardSettingsNeedsResave = false;

    function emptyThresholds() {
      return {
        tempLowC: null,
        tempHighC: null,
        humidityLow: null,
        humidityHigh: null,
      };
    }

    function normalizeThresholds(thresholds) {
      const normalized = emptyThresholds();
      if (!thresholds || typeof thresholds !== "object") return normalized;

      const tempLowC = Number(thresholds.tempLowC);
      const tempHighC = Number(thresholds.tempHighC);
      const humidityLow = Number(thresholds.humidityLow);
      const humidityHigh = Number(thresholds.humidityHigh);

      if (Number.isFinite(tempLowC)) normalized.tempLowC = tempLowC;
      if (Number.isFinite(tempHighC)) normalized.tempHighC = tempHighC;
      if (Number.isFinite(humidityLow)) normalized.humidityLow = Math.max(0, Math.min(100, humidityLow));
      if (Number.isFinite(humidityHigh)) normalized.humidityHigh = Math.max(0, Math.min(100, humidityHigh));
      return normalized;
    }

    function hasAnyThreshold(thresholds) {
      return (
        thresholds.tempLowC !== null ||
        thresholds.tempHighC !== null ||
        thresholds.humidityLow !== null ||
        thresholds.humidityHigh !== null
      );
    }

    function getThresholdsForAddress(address) {
      const key = normalizeAddress(address);
      if (!key) return emptyThresholds();
      return normalizeThresholds(state.sensorThresholds[key]);
    }

    function coerceBoolean(value, defaultValue) {
      if (typeof value === "boolean") return value;
      if (typeof value === "number") return value !== 0;
      if (typeof value === "string") {
        const lowered = value.trim().toLowerCase();
        if (["1", "true", "yes", "y", "on"].includes(lowered)) return true;
        if (["0", "false", "no", "n", "off"].includes(lowered)) return false;
      }
      return defaultValue;
    }

    async function apiFetchJson(url, options = {}) {
      const response = await fetch(url, options);
      const text = await response.text();
      let payload = {};
      if (text) {
        try {
          payload = JSON.parse(text);
        } catch (_) {
          payload = {error: text};
        }
      }
      if (!response.ok) {
        const errorMessage = payload && payload.error
          ? String(payload.error)
          : `${response.status} ${response.statusText}`;
        throw new Error(errorMessage);
      }
      return payload;
    }

    async function loadPersistedSettings() {
      const payload = await apiFetchJson("/api/settings");

      const dashboard = payload.dashboard_settings && typeof payload.dashboard_settings === "object"
        ? payload.dashboard_settings
        : {};
      const selectedAddress = normalizeAddress(dashboard.selected_address || "");
      state.selectedAddress = selectedAddress || null;
      state.windowSeconds = Math.max(
        MIN_SECONDS,
        Math.min(MAX_SECONDS, Math.round(Number(dashboard.window_seconds) || 3600)),
      );
      state.showTemp = coerceBoolean(dashboard.show_temp, true);
      state.showHumidity = coerceBoolean(dashboard.show_humidity, true);
      state.temperatureUnit = dashboard.temperature_unit === "F" ? "F" : "C";

      state.sensorAliases = {};
      state.sensorThresholds = {};
      const sensorSettings = payload.sensor_settings && typeof payload.sensor_settings === "object"
        ? payload.sensor_settings
        : {};
      for (const [address, value] of Object.entries(sensorSettings)) {
        if (!value || typeof value !== "object") continue;
        const key = normalizeAddress(address);
        if (!key) continue;

        const alias = typeof value.alias === "string" ? value.alias.trim() : "";
        if (alias) {
          state.sensorAliases[key] = alias;
        }

        const normalized = normalizeThresholds({
          tempLowC: value.temp_low_c,
          tempHighC: value.temp_high_c,
          humidityLow: value.humidity_low,
          humidityHigh: value.humidity_high,
        });
        if (hasAnyThreshold(normalized)) {
          state.sensorThresholds[key] = normalized;
        }
      }
    }

    async function persistDashboardSettings() {
      if (dashboardSettingsSaveInFlight) {
        dashboardSettingsNeedsResave = true;
        return;
      }
      dashboardSettingsSaveInFlight = true;
      try {
        await apiFetchJson("/api/settings/dashboard", {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            selected_address: state.selectedAddress,
            window_seconds: state.windowSeconds,
            show_temp: state.showTemp,
            show_humidity: state.showHumidity,
            temperature_unit: state.temperatureUnit,
          }),
        });
      } catch (error) {
        console.error("[diagnostics] persist_dashboard_settings_failed", {
          timestamp: new Date().toISOString(),
          error: String(error.message || error),
        });
      } finally {
        dashboardSettingsSaveInFlight = false;
        if (dashboardSettingsNeedsResave) {
          dashboardSettingsNeedsResave = false;
          persistDashboardSettings();
        }
      }
    }

    function queuePersistDashboardSettings() {
      if (dashboardSettingsSaveTimer !== null) {
        window.clearTimeout(dashboardSettingsSaveTimer);
      }
      dashboardSettingsSaveTimer = window.setTimeout(() => {
        dashboardSettingsSaveTimer = null;
        persistDashboardSettings();
      }, 150);
    }

    async function persistSensorSettingsForAddress(address) {
      const key = normalizeAddress(address);
      if (!key) return;
      const alias = state.sensorAliases[key] || null;
      const thresholds = getThresholdsForAddress(key);

      try {
        await apiFetchJson(`/api/settings/sensor/${encodeURIComponent(key)}`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            alias,
            temp_low_c: thresholds.tempLowC,
            temp_high_c: thresholds.tempHighC,
            humidity_low: thresholds.humidityLow,
            humidity_high: thresholds.humidityHigh,
          }),
        });
      } catch (error) {
        console.error("[diagnostics] persist_sensor_settings_failed", {
          timestamp: new Date().toISOString(),
          address: key,
          error: String(error.message || error),
        });
        throw error;
      }
    }

    function applySettingsToControls() {
      dom.windowSeconds.value = String(state.windowSeconds);
      dom.windowSlider.value = String(secondsToSlider(state.windowSeconds));
      dom.showTemp.checked = state.showTemp;
      dom.showHumidity.checked = state.showHumidity;
      dom.tempUnitF.checked = state.temperatureUnit === "F";
      dom.tempUnitC.checked = state.temperatureUnit !== "F";
      updateThresholdTemperatureLabels();
    }

    function getAliasForAddress(address) {
      return state.sensorAliases[normalizeAddress(address)] || "";
    }

    function getDisplayName(deviceName, address) {
      return getAliasForAddress(address) || deviceName || "Unknown sensor";
    }

    function getSelectedDevice() {
      return state.devices.find((device) => device.address === state.selectedAddress) || null;
    }

    function setViewMode(mode) {
      state.viewMode = mode === "chart" ? "chart" : "overview";
      const showingOverview = state.viewMode === "overview";
      dom.overviewPanel.classList.toggle("hidden-view", !showingOverview);
      dom.chartPanel.classList.toggle("hidden-view", showingOverview);
      if (showingOverview) {
        setMenuOpen(false);
      } else {
        updateChartTitle();
        updateStatusText();
        updateAlertBanner();
        drawChart();
      }
    }

    function formatHumidityValue(humidity) {
      return Number.isFinite(humidity) ? `${Math.round(humidity)}%` : "--";
    }

    function getDeviceAgeSeconds(device) {
      const timestamp = new Date(device.recorded_at || "").getTime();
      if (!Number.isFinite(timestamp)) return Number.POSITIVE_INFINITY;
      return Math.max(0, (Date.now() - timestamp) / 1000);
    }

    function getDeviceBatteryLevel(device) {
      const battery = Number(device.battery_pct);
      return Number.isFinite(battery) ? battery : null;
    }

    function isDeviceBatteryOut(device) {
      const battery = getDeviceBatteryLevel(device);
      return battery !== null && battery <= 1;
    }

    function isDeviceStale(device) {
      return getDeviceAgeSeconds(device) > SENSOR_STALE_SECONDS;
    }

    function isDeviceNonFunctional(device) {
      return isDeviceBatteryOut(device) || isDeviceStale(device);
    }

    function getBatteryTextClass(device) {
      const battery = getDeviceBatteryLevel(device);
      if (battery === null) return "";
      if (battery < 10) return "overview-battery--critical";
      if (battery < 20) return "overview-battery--warning";
      return "";
    }

    function isWithinThresholdProximity(value, low, high, margin) {
      if (!Number.isFinite(value)) return false;
      if (low !== null && value >= low && value - low <= margin) return true;
      if (high !== null && value <= high && high - value <= margin) return true;
      return false;
    }

    function getOverviewCardSeverity(device) {
      const address = normalizeAddress(device.address);
      if ((state.activeAlertsByAddress[address] || []).length) {
        return "alert";
      }

      const thresholds = getThresholdsForAddress(device.address);
      if (!hasAnyThreshold(thresholds)) {
        return "normal";
      }

      const tempC = Number(device.temperature_c);
      const humidity = Number(device.humidity_pct);
      const isNear = (
        isWithinThresholdProximity(tempC, thresholds.tempLowC, thresholds.tempHighC, TEMP_NEAR_MARGIN_C) ||
        isWithinThresholdProximity(
          humidity,
          thresholds.humidityLow,
          thresholds.humidityHigh,
          HUMIDITY_NEAR_MARGIN_PCT,
        )
      );
      return isNear ? "near" : "normal";
    }

    function renderOverviewCards() {
      dom.overviewGrid.innerHTML = "";
      if (!state.devices.length) {
        const empty = document.createElement("div");
        empty.className = "overview-empty";
        empty.textContent = "No ThermoPro sensors found.";
        dom.overviewGrid.appendChild(empty);
      } else {
        const devices = [...state.devices].sort((a, b) => (
          getDisplayName(a.name, a.address).localeCompare(getDisplayName(b.name, b.address))
        ));
        const fragment = document.createDocumentFragment();

        for (const device of devices) {
          const card = document.createElement("button");
          card.type = "button";
          const isNonFunctional = isDeviceNonFunctional(device);
          card.className = `overview-card overview-card--${getOverviewCardSeverity(device)}${isNonFunctional ? " overview-card--disabled" : ""}`;

          const tempText = formatTemperature(Number(device.temperature_c));
          const humidityText = formatHumidityValue(Number(device.humidity_pct));
          const batteryLevel = getDeviceBatteryLevel(device);
          let batteryText = batteryLevel === null ? "Battery --" : `Battery ${batteryLevel}%`;
          if (isDeviceStale(device)) {
            batteryText = batteryText === "Battery --"
              ? "No recent signal"
              : `${batteryText} | No recent signal`;
          }

          const nameNode = document.createElement("div");
          nameNode.className = "overview-name";
          nameNode.textContent = getDisplayName(device.name, device.address);

          const readingBox = document.createElement("div");
          readingBox.className = "overview-reading-box";

          const humidityNode = document.createElement("div");
          humidityNode.className = "overview-reading overview-reading-hum";
          const humidityValueNode = document.createElement("div");
          humidityValueNode.className = "overview-reading-value";
          humidityValueNode.textContent = humidityText;
          const humidityLabelNode = document.createElement("div");
          humidityLabelNode.className = "overview-reading-label";
          humidityLabelNode.textContent = "Humidity";
          humidityNode.appendChild(humidityValueNode);
          humidityNode.appendChild(humidityLabelNode);

          const tempNode = document.createElement("div");
          tempNode.className = "overview-reading overview-reading-temp";
          const tempValueNode = document.createElement("div");
          tempValueNode.className = "overview-reading-value";
          tempValueNode.textContent = tempText;
          const tempLabelNode = document.createElement("div");
          tempLabelNode.className = "overview-reading-label";
          tempLabelNode.textContent = "Temp";
          tempNode.appendChild(tempValueNode);
          tempNode.appendChild(tempLabelNode);

          readingBox.appendChild(humidityNode);
          readingBox.appendChild(tempNode);

          const batteryNode = document.createElement("div");
          batteryNode.className = "overview-battery";
          const batteryClass = getBatteryTextClass(device);
          if (batteryClass) {
            batteryNode.classList.add(batteryClass);
          }
          batteryNode.textContent = batteryText;

          card.appendChild(nameNode);
          card.appendChild(readingBox);
          card.appendChild(batteryNode);

          card.addEventListener("click", async () => {
            await openChartForAddress(device.address);
          });

          fragment.appendChild(card);
        }

        dom.overviewGrid.appendChild(fragment);
      }

      dom.overviewMeta.textContent = `Updated ${new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      })}`;
    }

    async function openChartForAddress(address) {
      const normalizedAddress = normalizeAddress(address);
      if (!normalizedAddress) return;

      state.selectedAddress = normalizedAddress;
      await persistDashboardSettings();
      renderDeviceSelect(normalizedAddress);
      syncAliasEditor(true);
      syncThresholdEditor(true);
      setViewMode("chart");
      await loadHistory();
    }

    function syncAliasEditor(force = false) {
      const currentAddress = normalizeAddress(state.selectedAddress);
      if (!currentAddress) {
        dom.sensorAliasInput.value = "";
        state.aliasInputAddress = null;
        state.aliasInputDirty = false;
        return;
      }

      if (
        !force &&
        state.aliasInputDirty &&
        state.aliasInputAddress === currentAddress
      ) {
        return;
      }

      dom.sensorAliasInput.value = getAliasForAddress(currentAddress);
      state.aliasInputAddress = currentAddress;
      state.aliasInputDirty = false;
    }

    function setThresholdInputsDisabled(disabled) {
      dom.thresholdTempLow.disabled = disabled;
      dom.thresholdTempHigh.disabled = disabled;
      dom.thresholdHumidityLow.disabled = disabled;
      dom.thresholdHumidityHigh.disabled = disabled;
      dom.saveThresholdButton.disabled = disabled;
      dom.clearThresholdButton.disabled = disabled;
    }

    function syncThresholdEditor(force = false) {
      const currentAddress = normalizeAddress(state.selectedAddress);
      if (!currentAddress) {
        dom.thresholdTempLow.value = "";
        dom.thresholdTempHigh.value = "";
        dom.thresholdHumidityLow.value = "";
        dom.thresholdHumidityHigh.value = "";
        state.thresholdInputAddress = null;
        state.thresholdInputDirty = false;
        setThresholdInputsDisabled(true);
        return;
      }

      setThresholdInputsDisabled(false);
      if (
        !force &&
        state.thresholdInputDirty &&
        state.thresholdInputAddress === currentAddress
      ) {
        return;
      }

      const thresholds = getThresholdsForAddress(currentAddress);
      dom.thresholdTempLow.value = thresholds.tempLowC === null ? "" : convertTempFromC(thresholds.tempLowC).toFixed(1);
      dom.thresholdTempHigh.value = thresholds.tempHighC === null ? "" : convertTempFromC(thresholds.tempHighC).toFixed(1);
      dom.thresholdHumidityLow.value = thresholds.humidityLow === null ? "" : String(Math.round(thresholds.humidityLow));
      dom.thresholdHumidityHigh.value = thresholds.humidityHigh === null ? "" : String(Math.round(thresholds.humidityHigh));
      state.thresholdInputAddress = currentAddress;
      state.thresholdInputDirty = false;
    }

    function updateChartTitle() {
      const selected = getSelectedDevice();
      if (!selected) {
        dom.chartTitle.textContent = "ThermPro Monitor";
        return;
      }
      dom.chartTitle.textContent = getDisplayName(selected.name, selected.address);
    }

    function setMenuOpen(open) {
      state.menuOpen = open;
      dom.controlDrawer.classList.toggle("open", open);
      dom.drawerBackdrop.classList.toggle("visible", open);
      dom.menuButton.setAttribute("aria-expanded", String(open));
      dom.controlDrawer.setAttribute("aria-hidden", String(!open));
    }

    function formatWindow(seconds) {
      if (seconds < 120) return `${seconds}s`;
      if (seconds < 7200) return `${Math.round(seconds / 60)}m`;
      if (seconds < 172800) return `${(seconds / 3600).toFixed(1)}h`;
      return "48h";
    }

    function sliderToSeconds(sliderValue) {
      const ratio = Number(sliderValue) / 1000;
      return Math.round(MIN_SECONDS * Math.pow(MAX_SECONDS / MIN_SECONDS, ratio));
    }

    function secondsToSlider(seconds) {
      const bounded = Math.max(MIN_SECONDS, Math.min(MAX_SECONDS, Number(seconds) || MIN_SECONDS));
      const ratio = Math.log(bounded / MIN_SECONDS) / Math.log(MAX_SECONDS / MIN_SECONDS);
      return Math.round(ratio * 1000);
    }

    function convertTempFromC(celsiusValue) {
      if (!Number.isFinite(celsiusValue)) return celsiusValue;
      return state.temperatureUnit === "F"
        ? celsiusValue * 9 / 5 + 32
        : celsiusValue;
    }

    function tempUnitSuffix() {
      return state.temperatureUnit === "F" ? "F" : "C";
    }

    function formatTemperature(celsiusValue) {
      if (!Number.isFinite(celsiusValue)) return "--";
      const converted = convertTempFromC(celsiusValue);
      return `${converted.toFixed(1)} ${tempUnitSuffix()}`;
    }

    function convertTempToC(displayValue) {
      if (!Number.isFinite(displayValue)) return displayValue;
      return state.temperatureUnit === "F"
        ? (displayValue - 32) * 5 / 9
        : displayValue;
    }

    function updateThresholdTemperatureLabels() {
      const unit = tempUnitSuffix();
      dom.thresholdTempLowLabel.textContent = `Temp low (${unit})`;
      dom.thresholdTempHighLabel.textContent = `Temp high (${unit})`;
    }

    function getSelectedAlerts() {
      const key = normalizeAddress(state.selectedAddress);
      return key ? (state.activeAlertsByAddress[key] || []) : [];
    }

    function formatTempThreshold(celsiusValue) {
      if (celsiusValue === null || celsiusValue === undefined) return "off";
      return `${convertTempFromC(celsiusValue).toFixed(1)} ${tempUnitSuffix()}`;
    }

    function formatHumidityThreshold(percentValue) {
      if (percentValue === null || percentValue === undefined) return "off";
      return `${Math.round(percentValue)}%`;
    }

    function formatThresholdSummary(address) {
      const thresholds = getThresholdsForAddress(address);
      return (
        `Temp low: ${formatTempThreshold(thresholds.tempLowC)}, ` +
        `Temp high: ${formatTempThreshold(thresholds.tempHighC)}, ` +
        `RH low: ${formatHumidityThreshold(thresholds.humidityLow)}, ` +
        `RH high: ${formatHumidityThreshold(thresholds.humidityHigh)}`
      );
    }

    function buildAlertsForDevice(device) {
      const thresholds = getThresholdsForAddress(device.address);
      if (!hasAnyThreshold(thresholds)) return [];

      const alerts = [];
      const tempC = Number(device.temperature_c);
      const humidity = Number(device.humidity_pct);

      if (Number.isFinite(tempC)) {
        if (thresholds.tempLowC !== null && tempC < thresholds.tempLowC) {
          alerts.push(`Temp ${formatTemperature(tempC)} below ${formatTempThreshold(thresholds.tempLowC)}`);
        }
        if (thresholds.tempHighC !== null && tempC > thresholds.tempHighC) {
          alerts.push(`Temp ${formatTemperature(tempC)} above ${formatTempThreshold(thresholds.tempHighC)}`);
        }
      }

      if (Number.isFinite(humidity)) {
        if (thresholds.humidityLow !== null && humidity < thresholds.humidityLow) {
          alerts.push(`RH ${Math.round(humidity)}% below ${formatHumidityThreshold(thresholds.humidityLow)}`);
        }
        if (thresholds.humidityHigh !== null && humidity > thresholds.humidityHigh) {
          alerts.push(`RH ${Math.round(humidity)}% above ${formatHumidityThreshold(thresholds.humidityHigh)}`);
        }
      }

      return alerts;
    }

    function serializeAlertMap(alertMap) {
      const stable = {};
      for (const address of Object.keys(alertMap).sort()) {
        stable[address] = alertMap[address];
      }
      return JSON.stringify(stable);
    }

    function updateAlertBanner() {
      const selectedAlerts = getSelectedAlerts();
      if (!selectedAlerts.length) {
        dom.alertBanner.classList.add("hidden");
        dom.alertBanner.textContent = "";
        return;
      }

      const selected = getSelectedDevice();
      const selectedAddress = normalizeAddress(state.selectedAddress);
      const selectedName = selected
        ? getDisplayName(selected.name, selected.address)
        : (selectedAddress || "Selected sensor");

      let totalOtherAlerts = 0;
      for (const [address, alerts] of Object.entries(state.activeAlertsByAddress)) {
        if (address === selectedAddress) continue;
        totalOtherAlerts += alerts.length;
      }

      const suffix = totalOtherAlerts > 0
        ? ` | ${totalOtherAlerts} other active alert${totalOtherAlerts === 1 ? "" : "s"}`
        : "";

      dom.alertBanner.textContent = `${selectedName}: ${selectedAlerts.join(" | ")}${suffix}`;
      dom.alertBanner.classList.remove("hidden");
    }

    function updateAlertsList() {
      const lines = [];
      for (const device of state.devices) {
        const address = normalizeAddress(device.address);
        const alerts = state.activeAlertsByAddress[address] || [];
        if (!alerts.length) continue;
        const name = getDisplayName(device.name, device.address);
        for (const alert of alerts) {
          lines.push(`${name}: ${alert}`);
        }
      }

      dom.alertsList.innerHTML = "";
      if (!lines.length) {
        dom.alertsList.textContent = "No active alerts.";
        return;
      }

      for (const line of lines) {
        const node = document.createElement("div");
        node.className = "alert-list-line critical";
        node.textContent = line;
        dom.alertsList.appendChild(node);
      }
    }

    function updateActiveAlertsFromDevices() {
      const previous = state.activeAlertsByAddress;
      const next = {};
      for (const device of state.devices) {
        const address = normalizeAddress(device.address);
        if (!address) continue;
        const alerts = buildAlertsForDevice(device);
        if (alerts.length) {
          next[address] = alerts;
        }
      }

      const prevSignature = serializeAlertMap(previous);
      const nextSignature = serializeAlertMap(next);
      if (prevSignature !== nextSignature) {
        console.info("[diagnostics] threshold_alerts_changed", {
          timestamp: new Date().toISOString(),
          previous,
          next,
        });
      }

      state.activeAlertsByAddress = next;
      updateAlertsList();
      updateAlertBanner();
      renderOverviewCards();
    }

    function formatTimestamp(isoValue) {
      const dt = new Date(isoValue);
      if (Number.isNaN(dt.getTime())) return isoValue;
      return dt.toLocaleString();
    }

    function lineColorTemp() {
      return getComputedStyle(document.documentElement).getPropertyValue("--temp").trim() || "#dc5f00";
    }

    function lineColorHumidity() {
      return getComputedStyle(document.documentElement).getPropertyValue("--humid").trim() || "#007e89";
    }

    function updateCurrentLegend() {
      if (!state.latest) {
        dom.currentTempValue.textContent = "--";
        dom.currentHumidityValue.textContent = "--";
        return;
      }

      const tempRaw = Number(state.latest.latestTemp);
      const humRaw = Number(state.latest.latestHumidity);
      const tempText = Number.isFinite(tempRaw)
        ? `${convertTempFromC(tempRaw).toFixed(1)} ${tempUnitSuffix()}`
        : "--";
      const humText = Number.isFinite(humRaw) ? `${Math.round(humRaw)}%` : "--";

      dom.currentTempValue.textContent = tempText;
      dom.currentHumidityValue.textContent = humText;
    }

    function updateTimeBox() {
      const now = new Date();
      dom.currentTimeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });

      if (!state.latest || !state.latest.latestRecordedAt) {
        dom.lastUpdateValue.textContent = "--";
        return;
      }

      const dt = new Date(state.latest.latestRecordedAt);
      if (Number.isNaN(dt.getTime())) {
        dom.lastUpdateValue.textContent = state.latest.latestRecordedAt;
        return;
      }
      dom.lastUpdateValue.textContent = dt.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function drawMessage(message) {
      const canvas = dom.chart;
      const ctx = canvas.getContext("2d");
      resizeCanvasForDisplay();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#5f6f7f";
      ctx.font = "600 18px 'Avenir Next', 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(message, canvas.width / 2, canvas.height / 2);
    }

    function resizeCanvasForDisplay() {
      const dpr = window.devicePixelRatio || 1;
      const rect = dom.chart.getBoundingClientRect();
      const width = Math.max(200, Math.floor(rect.width * dpr));
      const height = Math.max(180, Math.floor(rect.height * dpr));
      if (state.drawWidth !== width || state.drawHeight !== height) {
        state.drawWidth = width;
        state.drawHeight = height;
        dom.chart.width = width;
        dom.chart.height = height;
      }
      return dpr;
    }

    function createRange(values, fallbackMin, fallbackMax) {
      if (!values.length) return {min: fallbackMin, max: fallbackMax};
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 1;
        max += 1;
      } else {
        const pad = (max - min) * 0.08;
        min -= pad;
        max += pad;
      }
      return {min, max};
    }

    function drawAxisLabels(ctx, leftAxis, rightAxis, bounds, plotHeight) {
      const ticks = 5;
      const tickFont = `${Math.max(11, Math.round(bounds.scale * 11))}px 'Avenir Next', 'Segoe UI', sans-serif`;
      const headingFont = `700 ${Math.max(12, Math.round(bounds.scale * 12))}px 'Avenir Next', 'Segoe UI', sans-serif`;
      ctx.font = tickFont;
      ctx.textBaseline = "middle";

      if (leftAxis) {
        ctx.fillStyle = leftAxis.color;
        ctx.font = headingFont;
        ctx.textAlign = "right";
        ctx.fillText(leftAxis.heading, bounds.left - 10, bounds.top - Math.max(16, Math.round(bounds.scale * 16)));

        ctx.font = tickFont;
        ctx.textAlign = "right";
        for (let i = 0; i <= ticks; i += 1) {
          const ratio = i / ticks;
          const value = leftAxis.range.max - ratio * (leftAxis.range.max - leftAxis.range.min);
          const y = bounds.top + ratio * plotHeight;
          ctx.fillText(value.toFixed(leftAxis.decimals), bounds.left - 10, y);
        }
      }

      if (rightAxis) {
        ctx.fillStyle = rightAxis.color;
        ctx.font = headingFont;
        ctx.textAlign = "left";
        ctx.fillText(rightAxis.heading, bounds.right + 10, bounds.top - Math.max(16, Math.round(bounds.scale * 16)));

        ctx.font = tickFont;
        ctx.textAlign = "left";
        for (let i = 0; i <= ticks; i += 1) {
          const ratio = i / ticks;
          const value = rightAxis.range.max - ratio * (rightAxis.range.max - rightAxis.range.min);
          const y = bounds.top + ratio * plotHeight;
          ctx.fillText(value.toFixed(rightAxis.decimals), bounds.right + 10, y);
        }
      }
    }

    function drawGrid(ctx, bounds, plotWidth, plotHeight) {
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue("--grid").trim() || "#d5dee8";
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = Math.max(1, Math.round(bounds.scale));

      const hLines = 5;
      for (let i = 0; i <= hLines; i += 1) {
        const y = bounds.top + (i / hLines) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(bounds.left, y);
        ctx.lineTo(bounds.right, y);
        ctx.stroke();
      }

      const vLines = 6;
      for (let i = 0; i <= vLines; i += 1) {
        const x = bounds.left + (i / vLines) * plotWidth;
        ctx.beginPath();
        ctx.moveTo(x, bounds.top);
        ctx.lineTo(x, bounds.bottom);
        ctx.stroke();
      }
    }

    function drawTimeLabels(ctx, points, bounds, plotWidth) {
      if (points.length < 2) return;
      const first = new Date(points[0].recorded_at).getTime();
      const last = new Date(points[points.length - 1].recorded_at).getTime();
      if (!Number.isFinite(first) || !Number.isFinite(last) || first === last) return;

      const ticks = 6;
      ctx.fillStyle = "#516272";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.font = `${Math.max(11, Math.round(bounds.scale * 11))}px 'Avenir Next', 'Segoe UI', sans-serif`;

      for (let i = 0; i <= ticks; i += 1) {
        const ratio = i / ticks;
        const ts = first + ratio * (last - first);
        const x = bounds.left + ratio * plotWidth;
        const label = new Date(ts).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
        ctx.fillText(label, x, bounds.bottom + Math.max(8, Math.round(bounds.scale * 8)));
      }
    }

    function drawLine(ctx, points, bounds, range, accessor, color, timeMin, timeMax, plotHeight, plotWidth) {
      if (points.length < 2) return;
      const span = timeMax - timeMin || 1;
      const ySpan = range.max - range.min || 1;
      let started = false;

      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(4, Math.round(bounds.scale * 4));
      ctx.beginPath();

      for (let i = 0; i < points.length; i += 1) {
        const ts = new Date(points[i].recorded_at).getTime();
        const value = accessor(points[i]);
        if (!Number.isFinite(ts) || !Number.isFinite(value)) continue;
        const x = bounds.left + ((ts - timeMin) / span) * plotWidth;
        const y = bounds.top + ((range.max - value) / ySpan) * plotHeight;
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      if (started) ctx.stroke();
    }

    function latestFiniteValue(points, accessor) {
      for (let i = points.length - 1; i >= 0; i -= 1) {
        const value = accessor(points[i]);
        if (Number.isFinite(value)) return value;
      }
      return null;
    }

    function formatMarkerValue(value) {
      if (!Number.isFinite(value)) return "--";
      return String(Number.parseFloat(value.toPrecision(12)));
    }

    function drawSideValueMarker(ctx, bounds, range, value, side, color, labelText) {
      if (!range || !Number.isFinite(value)) return;
      const span = range.max - range.min || 1;
      const unclampedY = bounds.top + ((range.max - value) / span) * (bounds.bottom - bounds.top);
      const yPad = Math.max(10, Math.round(bounds.scale * 10));
      const y = Math.max(bounds.top + yPad, Math.min(bounds.bottom - yPad, unclampedY));
      const markerLen = Math.max(8, Math.round(bounds.scale * 8));
      const markerGap = Math.max(10, Math.round(bounds.scale * 10));

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.max(2, Math.round(bounds.scale * 2));
      ctx.font = `700 ${Math.max(11, Math.round(bounds.scale * 11))}px 'Avenir Next', 'Segoe UI', sans-serif`;
      ctx.textBaseline = "middle";

      if (side === "left") {
        const x0 = bounds.left;
        const x1 = bounds.left - markerLen;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.fillText(labelText, x1 - markerGap, y);
      } else {
        const x0 = bounds.right;
        const x1 = bounds.right + markerLen;
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.stroke();
        ctx.textAlign = "left";
        ctx.fillText(labelText, x1 + markerGap, y);
      }

      ctx.restore();
    }

    function drawChart() {
      if (!state.showTemp && !state.showHumidity) {
        drawMessage("Enable temperature and/or humidity to draw the graph.");
        return;
      }
      if (!state.points.length) {
        drawMessage("No readings in the selected timescale.");
        return;
      }

      const canvas = dom.chart;
      const ctx = canvas.getContext("2d");
      const dpr = resizeCanvasForDisplay();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const leftPad = state.showTemp ? Math.round(90 * dpr) : Math.round(58 * dpr);
      const rightPad = state.showHumidity ? Math.round(96 * dpr) : Math.round(20 * dpr);
      const topPad = Math.round(86 * dpr);
      const bottomPad = Math.round(58 * dpr);

      const bounds = {
        left: leftPad,
        right: canvas.width - rightPad,
        top: topPad,
        bottom: canvas.height - bottomPad,
        scale: dpr,
      };
      const plotWidth = bounds.right - bounds.left;
      const plotHeight = bounds.bottom - bounds.top;
      if (plotWidth <= 0 || plotHeight <= 0) {
        drawMessage("Viewport too small to draw chart.");
        return;
      }

      drawGrid(ctx, bounds, plotWidth, plotHeight);

      const timestamps = state.points.map((p) => new Date(p.recorded_at).getTime()).filter(Number.isFinite);
      const timeMin = Math.min(...timestamps);
      const timeMax = Math.max(...timestamps);

      let leftAxis = null;
      let rightAxis = null;
      let tempRange = null;
      let humidityRange = null;

      if (state.showTemp) {
        const convertedTemps = state.points
          .map((p) => convertTempFromC(Number(p.temperature_c)))
          .filter(Number.isFinite);
        tempRange = createRange(convertedTemps, convertTempFromC(0), convertTempFromC(40));
        leftAxis = {
          range: tempRange,
          decimals: 1,
          color: lineColorTemp(),
          heading: "TEMP",
        };
      }

      if (state.showHumidity) {
        humidityRange = {min: 0, max: 100};
        if (state.showTemp) {
          rightAxis = {
            range: humidityRange,
            decimals: 0,
            color: lineColorHumidity(),
            heading: "RH",
          };
        } else {
          leftAxis = {
            range: humidityRange,
            decimals: 0,
            color: lineColorHumidity(),
            heading: "RH",
          };
        }
      }

      drawAxisLabels(ctx, leftAxis, rightAxis, bounds, plotHeight);
      drawTimeLabels(ctx, state.points, bounds, plotWidth);

      if (state.showTemp && tempRange) {
        drawLine(
          ctx,
          state.points,
          bounds,
          tempRange,
          (p) => convertTempFromC(Number(p.temperature_c)),
          lineColorTemp(),
          timeMin,
          timeMax,
          plotHeight,
          plotWidth,
        );
      }

      if (state.showHumidity && humidityRange) {
        const range = state.showTemp ? rightAxis.range : leftAxis.range;
        drawLine(
          ctx,
          state.points,
          bounds,
          range,
          (p) => Number(p.humidity_pct),
          lineColorHumidity(),
          timeMin,
          timeMax,
          plotHeight,
          plotWidth,
        );
      }

      if (state.showTemp && tempRange) {
        const latestTemp = latestFiniteValue(
          state.points,
          (p) => convertTempFromC(Number(p.temperature_c)),
        );
        if (latestTemp !== null) {
          drawSideValueMarker(
            ctx,
            bounds,
            tempRange,
            latestTemp,
            "left",
            lineColorTemp(),
            `${formatMarkerValue(latestTemp)} ${tempUnitSuffix()}`,
          );
        }
      }

      if (state.showHumidity && humidityRange) {
        const latestRh = latestFiniteValue(
          state.points,
          (p) => Number(p.humidity_pct),
        );
        if (latestRh !== null) {
          drawSideValueMarker(
            ctx,
            bounds,
            humidityRange,
            latestRh,
            "right",
            lineColorHumidity(),
            `${formatMarkerValue(latestRh)}%`,
          );
        }
      }
    }

    function refreshBatteryBadge() {
      if (state.batteryPct === null || state.batteryPct === undefined) {
        dom.batteryBadge.textContent = "Battery: --";
        return;
      }
      dom.batteryBadge.textContent = `Battery: ${state.batteryPct}%`;
    }

    function parseOptionalNumberInput(rawValue, label) {
      const text = String(rawValue || "").trim();
      if (!text) return null;
      const parsed = Number(text);
      if (!Number.isFinite(parsed)) {
        throw new Error(`${label} must be a valid number.`);
      }
      return parsed;
    }

    async function saveSelectedThresholds() {
      if (!state.selectedAddress) {
        throw new Error("Choose a sensor before saving thresholds.");
      }

      const tempLowValue = parseOptionalNumberInput(dom.thresholdTempLow.value, "Temp low");
      const tempHighValue = parseOptionalNumberInput(dom.thresholdTempHigh.value, "Temp high");
      const humidityLowValue = parseOptionalNumberInput(dom.thresholdHumidityLow.value, "Humidity low");
      const humidityHighValue = parseOptionalNumberInput(dom.thresholdHumidityHigh.value, "Humidity high");

      if (humidityLowValue !== null && (humidityLowValue < 0 || humidityLowValue > 100)) {
        throw new Error("Humidity low must be between 0 and 100.");
      }
      if (humidityHighValue !== null && (humidityHighValue < 0 || humidityHighValue > 100)) {
        throw new Error("Humidity high must be between 0 and 100.");
      }

      const thresholds = normalizeThresholds({
        tempLowC: tempLowValue === null ? null : convertTempToC(tempLowValue),
        tempHighC: tempHighValue === null ? null : convertTempToC(tempHighValue),
        humidityLow: humidityLowValue,
        humidityHigh: humidityHighValue,
      });

      if (
        thresholds.tempLowC !== null &&
        thresholds.tempHighC !== null &&
        thresholds.tempLowC > thresholds.tempHighC
      ) {
        throw new Error("Temp low must be less than or equal to temp high.");
      }
      if (
        thresholds.humidityLow !== null &&
        thresholds.humidityHigh !== null &&
        thresholds.humidityLow > thresholds.humidityHigh
      ) {
        throw new Error("Humidity low must be less than or equal to humidity high.");
      }

      const key = normalizeAddress(state.selectedAddress);
      if (hasAnyThreshold(thresholds)) {
        state.sensorThresholds[key] = thresholds;
      } else {
        delete state.sensorThresholds[key];
      }
      await persistSensorSettingsForAddress(key);
      state.thresholdInputAddress = key;
      state.thresholdInputDirty = false;
      syncThresholdEditor(true);
      console.info("[diagnostics] threshold_settings_saved", {
        timestamp: new Date().toISOString(),
        address: key,
        thresholds: state.sensorThresholds[key] || emptyThresholds(),
      });
      updateActiveAlertsFromDevices();
      updateStatusText();
    }

    function updateStatusText() {
      if (!state.latest) {
        dom.statusText.textContent = "No sensor data loaded yet.";
        return;
      }

      const latestTs = state.latest.latestRecordedAt
        ? formatTimestamp(state.latest.latestRecordedAt)
        : "No data yet";
      const deviceName = getDisplayName(state.latest.name, state.selectedAddress);
      const tempText = formatTemperature(Number(state.latest.latestTemp));
      const humValue = Number(state.latest.latestHumidity);
      const humText = Number.isFinite(humValue) ? `${Math.round(humValue)}%` : "--";
      const thresholdText = formatThresholdSummary(state.selectedAddress);
      const alerts = getSelectedAlerts();
      const alertText = alerts.length ? alerts.join(" | ") : "none";

      dom.statusText.textContent =
        `Sensor: ${deviceName}\n` +
        `Latest: ${latestTs}\n` +
        `Temperature: ${tempText}\n` +
        `Humidity: ${humText}\n` +
        `Thresholds: ${thresholdText}\n` +
        `Alerts: ${alertText}\n` +
        `Window: ${formatWindow(state.windowSeconds)}`;
    }

    async function loadDevices() {
      const response = await fetch("/api/devices");
      if (!response.ok) throw new Error("Failed to load devices");
      const payload = await response.json();
      state.devices = payload.devices || [];

      renderDeviceSelect(payload.default_address || null);
      updateActiveAlertsFromDevices();
    }

    function renderDeviceSelect(defaultAddress = null) {
      const selectedBeforeRender = state.selectedAddress;
      dom.deviceSelect.innerHTML = "";
      if (!state.devices.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "No ThermoPro sensors found";
        dom.deviceSelect.appendChild(opt);
        state.selectedAddress = null;
        syncAliasEditor();
        syncThresholdEditor();
        updateChartTitle();
        updateAlertBanner();
        updateAlertsList();
        queuePersistDashboardSettings();
        return;
      }

      const selectedStillPresent = state.devices.some((d) => d.address === state.selectedAddress);
      if (!selectedStillPresent) {
        state.selectedAddress = defaultAddress || state.devices[0].address;
      }

      for (const device of state.devices) {
        const option = document.createElement("option");
        option.value = device.address;
        option.textContent = `${getDisplayName(device.name, device.address)} (${device.address})`;
        dom.deviceSelect.appendChild(option);
      }
      dom.deviceSelect.value = state.selectedAddress;
      syncAliasEditor();
      syncThresholdEditor();
      updateChartTitle();
      updateAlertBanner();
      if (selectedBeforeRender !== state.selectedAddress) {
        queuePersistDashboardSettings();
      }
    }

    async function loadHistory() {
      if (!state.selectedAddress) {
        state.points = [];
        state.latest = null;
        state.batteryPct = null;
        refreshBatteryBadge();
        updateCurrentLegend();
        updateTimeBox();
        updateStatusText();
        updateAlertBanner();
        updateAlertsList();
        drawChart();
        return;
      }

      const params = new URLSearchParams({
        address: state.selectedAddress,
        seconds: String(state.windowSeconds),
      });
      const response = await fetch(`/api/history?${params.toString()}`);
      if (!response.ok) {
        const details = await response.text();
        throw new Error(`History request failed: ${details}`);
      }

      const payload = await response.json();
      state.points = payload.points || [];
      state.latest = {
        name: payload.name,
        latestRecordedAt: payload.latest_recorded_at,
        latestTemp: payload.latest_temperature_c,
        latestHumidity: payload.latest_humidity_pct,
      };
      state.batteryPct = payload.battery_pct;
      refreshBatteryBadge();
      updateCurrentLegend();
      updateTimeBox();
      updateStatusText();
      updateChartTitle();
      updateAlertBanner();
      updateAlertsList();
      drawChart();
    }

    async function refreshAll() {
      try {
        await loadDevices();
        await loadHistory();
      } catch (err) {
        console.error(err);
        state.latest = null;
        updateCurrentLegend();
        updateTimeBox();
        updateAlertBanner();
        updateAlertsList();
        dom.statusText.textContent = String(err.message || err);
        drawMessage("Unable to load data.");
      }
    }

    function bindEvents() {
      dom.backButton.addEventListener("click", () => {
        setViewMode("overview");
        renderOverviewCards();
      });

      dom.menuButton.addEventListener("click", () => {
        setMenuOpen(!state.menuOpen);
      });
      dom.closeMenuButton.addEventListener("click", () => {
        setMenuOpen(false);
      });
      dom.drawerBackdrop.addEventListener("click", () => {
        setMenuOpen(false);
      });

      dom.deviceSelect.addEventListener("change", async () => {
        state.selectedAddress = dom.deviceSelect.value || null;
        queuePersistDashboardSettings();
        syncAliasEditor(true);
        syncThresholdEditor(true);
        updateChartTitle();
        updateAlertBanner();
        await loadHistory();
      });

      dom.windowSlider.addEventListener("input", async () => {
        const sec = sliderToSeconds(dom.windowSlider.value);
        state.windowSeconds = sec;
        dom.windowSeconds.value = String(sec);
        queuePersistDashboardSettings();
        await loadHistory();
      });

      dom.windowSeconds.addEventListener("change", async () => {
        const sec = Math.max(MIN_SECONDS, Math.min(MAX_SECONDS, Number(dom.windowSeconds.value) || MIN_SECONDS));
        state.windowSeconds = sec;
        dom.windowSeconds.value = String(sec);
        dom.windowSlider.value = String(secondsToSlider(sec));
        queuePersistDashboardSettings();
        await loadHistory();
      });

      dom.showTemp.addEventListener("change", () => {
        state.showTemp = dom.showTemp.checked;
        queuePersistDashboardSettings();
        drawChart();
      });

      dom.showHumidity.addEventListener("change", () => {
        state.showHumidity = dom.showHumidity.checked;
        queuePersistDashboardSettings();
        drawChart();
      });

      const applySelectedUnit = () => {
        state.temperatureUnit = dom.tempUnitF.checked ? "F" : "C";
        queuePersistDashboardSettings();
        updateThresholdTemperatureLabels();
        syncThresholdEditor(true);
        updateActiveAlertsFromDevices();
        updateCurrentLegend();
        updateStatusText();
        drawChart();
      };

      dom.tempUnitC.addEventListener("change", applySelectedUnit);
      dom.tempUnitF.addEventListener("change", applySelectedUnit);

      dom.saveAliasButton.addEventListener("click", async () => {
        if (!state.selectedAddress) return;
        const key = normalizeAddress(state.selectedAddress);
        const alias = dom.sensorAliasInput.value.trim();
        if (alias) {
          state.sensorAliases[key] = alias;
        } else {
          delete state.sensorAliases[key];
        }
        try {
          await persistSensorSettingsForAddress(key);
          state.aliasInputAddress = key;
          state.aliasInputDirty = false;
          renderDeviceSelect();
          updateActiveAlertsFromDevices();
          updateStatusText();
        } catch (err) {
          dom.statusText.textContent = String(err.message || err);
        }
      });

      dom.clearAliasButton.addEventListener("click", async () => {
        if (!state.selectedAddress) return;
        const key = normalizeAddress(state.selectedAddress);
        delete state.sensorAliases[key];
        dom.sensorAliasInput.value = "";
        try {
          await persistSensorSettingsForAddress(key);
          state.aliasInputAddress = key;
          state.aliasInputDirty = false;
          renderDeviceSelect();
          updateActiveAlertsFromDevices();
          updateStatusText();
        } catch (err) {
          dom.statusText.textContent = String(err.message || err);
        }
      });

      dom.sensorAliasInput.addEventListener("input", () => {
        state.aliasInputAddress = normalizeAddress(state.selectedAddress);
        state.aliasInputDirty = true;
      });

      dom.sensorAliasInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        dom.saveAliasButton.click();
      });

      for (const input of [
        dom.thresholdTempLow,
        dom.thresholdTempHigh,
        dom.thresholdHumidityLow,
        dom.thresholdHumidityHigh,
      ]) {
        input.addEventListener("input", () => {
          state.thresholdInputAddress = normalizeAddress(state.selectedAddress);
          state.thresholdInputDirty = true;
        });
      }

      dom.saveThresholdButton.addEventListener("click", async () => {
        try {
          await saveSelectedThresholds();
        } catch (err) {
          dom.statusText.textContent = String(err.message || err);
        }
      });

      dom.clearThresholdButton.addEventListener("click", async () => {
        if (!state.selectedAddress) return;
        const key = normalizeAddress(state.selectedAddress);
        delete state.sensorThresholds[key];
        try {
          await persistSensorSettingsForAddress(key);
          state.thresholdInputAddress = key;
          state.thresholdInputDirty = false;
          syncThresholdEditor(true);
          console.info("[diagnostics] threshold_settings_cleared", {
            timestamp: new Date().toISOString(),
            address: key,
          });
          updateActiveAlertsFromDevices();
          updateStatusText();
        } catch (err) {
          dom.statusText.textContent = String(err.message || err);
        }
      });

      window.addEventListener("resize", () => {
        if (state.viewMode === "chart") {
          drawChart();
        } else {
          renderOverviewCards();
        }
      });
    }

    async function init() {
      try {
        await loadPersistedSettings();
      } catch (error) {
        console.error("[diagnostics] load_persisted_settings_failed", {
          timestamp: new Date().toISOString(),
          error: String(error.message || error),
        });
      }
      applySettingsToControls();

      syncThresholdEditor(true);
      setViewMode("overview");
      renderOverviewCards();
      updateCurrentLegend();
      updateTimeBox();
      updateAlertsList();
      updateAlertBanner();
      bindEvents();
      await refreshAll();
      window.setInterval(refreshAll, REFRESH_MS);
      window.setInterval(updateTimeBox, 1000);
    }

    init();
  </script>
</body>
</html>
